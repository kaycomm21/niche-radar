name: secret-check
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check YOUTUBE_API_KEY (value never printed)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then echo "RESULT: SECRET_MISSING"; exit 1; fi
          echo "RESULT: SECRET_PRESENT (length ${#YOUTUBE_API_KEY})"
          code=$(curl -s -o resp.json -w '%{http_code}' "https://www.googleapis.com/youtube/v3/videos?part=id&chart=mostPopular&regionCode=KR&maxResults=1&key=$YOUTUBE_API_KEY")
          echo "RESULT: API_HTTP_$code (1 quota unit)"
          if [ "$code" != "200" ]; then python3 -c "import json;d=json.load(open('resp.json'));print('REASON:',d['error']['errors'][0].get('reason'))"; exit 1; fi
