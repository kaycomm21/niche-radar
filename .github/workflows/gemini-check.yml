name: gemini-check
# GEMINI_API_KEY 진단: 모델 목록 조회 + 짧은 생성 1회 (키 값은 출력하지 않음)
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q google-auth requests
      - name: Vertex AI (GCP 크레딧) 진단
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then echo "GCP_SA_KEY 없음 — 건너뜀"; exit 0; fi
          GEMINI_API_KEY= python -c "from radar.llm import gemini_json; print('Vertex OK →', gemini_json('JSON으로 {\"ok\": true} 만 답해'))" || true
      - name: AI Studio 키 진단
        env:
          K: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "키 길이: ${#K}, 접두어: ${K:0:4}…"
          for m in gemini-2.5-flash gemini-2.0-flash gemini-2.5-flash-lite; do
            code=$(curl -s -o r.json -w '%{http_code}' -H 'Content-Type: application/json' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent?key=$K" \
              -d '{"contents":[{"parts":[{"text":"안녕이라고만 답해"}]}]}')
            echo "== $m → HTTP $code"; python3 -c "import json;d=json.load(open('r.json'));print(json.dumps(d.get('error',{}),ensure_ascii=False)[:500] if 'error' in d else d['candidates'][0]['content']['parts'][0]['text'])"
          done
