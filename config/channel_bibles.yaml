# 내 채널 요약 (Gemini 적합도 판정 입력). 로컬 채널 바이블 원문으로 교체·보강 가능.
# 형식:  "채널명": "한 줄 설명 | 톤 | 금지"
"경제적자유구역": "40~60대 직장인·은퇴 준비자를 위한 재테크·부업·경제 해설 내레이션 롱폼 | 차분한 해설, 계산과 체크리스트 | 종목 추천·수익 보장 금지"
"지혜의숲": "중장년을 위한 인생 조언·명언·관계 지혜 오디오북형 내레이션 | 따뜻하고 단정한 낭독 | 특정 종교 비방 금지"
"히스토리X": "세계사·한국사의 흥망성쇠를 이야기로 푸는 내레이션 다큐 | 긴장감 있는 스토리텔링 | 역사 왜곡·혐오 금지"
"음악플레이리스트": "작업·휴식용 장르 플레이리스트(시티팝·펑크·로파이) | 분위기 중심 | 타인 음원 사용 금지(자체 생성 음악만)"
"레트로TV": "80~90년대 추억·레트로 문화 회상 | 향수, 유쾌함 | 방송 원본 클립 사용 금지"
"국뽕두그릇": "해외에서 본 한국 이야기 해설 | 사실 기반 자부심 | 타국 비하·짜깁기 반응 영상 금지"
"부자아이": "부모·아이를 위한 쉬운 경제교육 | 친근하고 쉬운 설명 | 아동 대상 광고 정책 준수"
"웃GO": "AI 콩트·코미디 쇼츠 | 짧은 반전 | 실존 인물 조롱 금지"
"REDPANG": "영유아 동요·학습 애니메이션 | 밝고 반복적 | 아동용 콘텐츠 정책 준수"
"춘식이만식이": "쌍둥이 육아 일상 | 가족적 | 아동 개인정보 노출 주의"
