# 카테고리별 RPM 가정치 (원 / 조회 1,000회, 크리에이터 수령 기준)
# ⚠️ 출처 있는 실측값이 아님. 업계에서 흔히 말하는 범위를 바탕으로 한 '초기 가정치'이며,
#    Phase 2에서 M4(내 채널 YouTube Analytics 실측 RPM)로 교체한다.
# 형식:  "카테고리ID": [롱폼 하한, 롱폼 상한]   # 이름
"1":  [800, 2500]    # 영화/애니메이션
"2":  [1500, 4500]   # 자동차
"10": [500, 1800]    # 음악
"15": [800, 2500]    # 반려동물
"17": [800, 2500]    # 스포츠
"19": [1200, 3500]   # 여행
"20": [600, 2000]    # 게임
"22": [1000, 3500]   # 인물/블로그
"23": [600, 2000]    # 코미디
"24": [700, 2500]    # 엔터테인먼트
"25": [1500, 5000]   # 뉴스/정치
"26": [1500, 5000]   # 노하우/스타일
"27": [2000, 6000]   # 교육
"28": [2000, 6000]   # 과학기술
"29": [800, 2500]    # 비영리
"default": [800, 2500]
# 쇼츠는 카테고리 구분 없이 별도 가정치
"shorts": [30, 120]
# 주제 키워드 보정: 제목에 아래 키워드가 있으면 상한·하한에 배수 적용 (금융·재테크·건강 = 고RPM)
"kw_finance": [1.6, 1.6]   # 금리 주식 부동산 재테크 투자 경제 연금 세금 코인 ETF 대출
"kw_health":  [1.3, 1.3]   # 건강 질병 혈압 당뇨 다이어트 영양
